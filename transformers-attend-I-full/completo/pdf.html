<script>
// the PDFs of the paper (the original and its translations) and, for each, the page of every statement: a link
// #page=N&n=<label> opens the statement at its own page in the language the reader chose (remembered)
var LM_PDF = {"en": {"file": "paper.pdf", "pages": {"def:dead_active": 15, "def:scales": 17, "prop:lerch_pade": 21, "thm:maxent_power_law": 27, "thm:maxent": 28, "thm:cv_hagedorn": 31, "thm:area_law": 32, "def:phases": 33, "def:lcrit": 48, "thm:kv_window": 50, "def:bands": 60, "def:deltag": 70, "prop:causal_reference": 87, "conj:hallu": 94}}, "es": {"file": "paper_es.pdf", "pages": {"def:dead_active": 17, "def:scales": 18, "prop:lerch_pade": 24, "thm:maxent_power_law": 30, "thm:maxent": 31, "thm:cv_hagedorn": 34, "thm:area_law": 35, "def:phases": 36, "def:lcrit": 52, "thm:kv_window": 54, "def:bands": 64, "def:deltag": 77, "prop:causal_reference": 95, "conj:hallu": 102}}};
(function(){
  function lang(){
    var l = null;
    try { l = localStorage.getItem('lm-pdf-lang'); } catch (e) {}
    return LM_PDF[l] ? l : 'en';
  }
  function open(){
    var L = lang(), d = LM_PDF[L];
    var n = /[#&]n=([^&]+)/.exec(location.hash), p = /page=(\d+)/.exec(location.hash);
    var page = n && d.pages[decodeURIComponent(n[1])] ? d.pages[decodeURIComponent(n[1])] : (p ? p[1] : null);
    document.getElementById('pdf').src = d.file + (page ? '#page=' + page : '');
    var dl = document.getElementById('pdfdl') || document.querySelector('a[download]');
    if (dl) dl.setAttribute('href', d.file);
    document.querySelectorAll('a[data-lang]').forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('data-lang') === L);
    });
  }
  // the language switch floats over the PDF, bottom right (8-nov, Carles: «en gh solo sale castellano»): at the end of
  // the top bar it fell off-screen below ~1200 px, and with «es» remembered the reader had no way back to English
  var langs = Object.keys(LM_PDF);
  if (langs.length > 1 && !document.getElementById('lmlang')) {
    var NAMES = {"en": "English", "es": "Español", "fr": "Français", "de": "Deutsch", "it": "Italiano", "ca": "Català"};
    var box = document.createElement('div'); box.id = 'lmlang';
    box.setAttribute('style', 'position:fixed;right:16px;bottom:16px;z-index:1000;display:flex;gap:6px;' +
      'background:rgba(255,255,255,.95);border:1px solid #b9cde2;border-radius:8px;padding:6px 8px;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.18);font:13px Arial,sans-serif');
    langs.forEach(function (l) {
      var a = document.createElement('a'); a.href = '#'; a.setAttribute('data-lang', l);
      a.textContent = NAMES[l] || l; a.title = 'The paper in ' + (NAMES[l] || l);
      a.setAttribute('style', 'border:1px solid #9fb7cf;border-radius:4px;padding:3px 10px;color:#222;' +
        'text-decoration:none;background:#fff');
      box.appendChild(a);
    });
    document.body.appendChild(box);
  }
  var css = document.createElement('style');
  css.textContent = '#lmlang a.on{background:#8e24aa !important;color:#fff !important;border-color:#8e24aa !important;font-weight:600}';
  document.head.appendChild(css);
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-lang]');
    if (!a) return;
    e.preventDefault();
    try { localStorage.setItem('lm-pdf-lang', a.getAttribute('data-lang')); } catch (x) {}
    open();
  });
  window.addEventListener('hashchange', open); open();
})();
</script>

heorem K.2 — Affine-exposure bias", "th:formal_mixture": "Theorem K.3 — Positive mixtures of powers", "th:formal_quantiles": "Theorem K.4 — Exponent and support order", "th:formal_family": "Theorem K.5 — Smoothness, entropy and divergence bounds", "th:formal_truncation": "Theorem K.6 — Exact divergences and sharp frozen-output bounds", "th:formal_softmax": "Theorem K.7 — Sharp oscillation stability", "th:formal_rope": "Theorem K.8 — Cosine-grid approximation and logarithmic remainder"};
  function label(a){
    var h = a.getAttribute('href') || '';
    var k = h.indexOf('#'); if (k < 0) return null;
    var id = decodeURIComponent(h.slice(k + 1).split('&')[0]);
    if (NAMES[id]) return NAMES[id];
    if (h.charAt(0) !== '#') return null;
    var t = document.getElementById(id);  // a citation: its entry in the bibliography
    if (t && /bib|ref/i.test((t.className || '') + ' ' + (t.parentElement && t.parentElement.className || ''))) {
      var s = (t.closest('li, dd, p') || t).textContent.replace(/\s+/g, ' ').trim();
      return s.length > 180 ? s.slice(0, 177) + '…' : s;
    }
    return null;
  }
  function apply(){
    RULES.forEach(function (r) {
      if (!r[1]) return;
      document.querySelectorAll(r[0]).forEach(function (e) { if (!e.getAttribute('title')) e.setAttribute('title', r[1]); });
    });
    document.querySelectorAll('summary').forEach(function (e) {
      if (e.getAttribute('title')) return;
      var t = e.textContent.trim();
      for (var i = 0; i < SUMMARY.length; i++) if (t.indexOf(SUMMARY[i][0]) === 0) { e.setAttribute('title', SUMMARY[i][1]); return; }
    });
    document.querySelectorAll('a[href*="#"]').forEach(function (a) {
      if (a.getAttribute('title') || a.closest('svg')) return;
      var t = label(a); if (t) a.setAttribute('title', t);
    });
  }
  function start(){
    apply();
    var due = null;
    new MutationObserver(function () {
      if (due === null) due = setTimeout(function () { due = null; apply(); }, 300);
    }).observe(document.body, {childList: true, subtree: true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
