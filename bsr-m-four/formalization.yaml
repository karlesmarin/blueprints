    5: the named pieces; the remaining arguments of the lemma are proved in the text only (the paper, «What is checked
    by machine»); Lemma 6: the algebraic core (Jacobi turns (4) into (5), the form of K, the bordered maps commute);
    the reduction to that core is in the text; Lemma 7: the classification of linear spaces of matrices of rank
    at most one; the remaining arguments are proved in the text only; Theorem 25: the polarization of symmetric
    trilinear forms (case (ii)) and computation C3; the rest is proved in the text only; Lemma 26: the enumeration
    of the support triples and the support count; the bounds themselves are proved in the text; Lemma 27: the kernel
    of the polar map (9); the rest is proved in the text; Lemma 8: the regular tuple; the paper also confirms it
    by an exact rank computation (C6); Proposition 10: the incidence count of the m×4 form (M − 2(m+3) + (2m+4)
    = M − 2); the rest is a written proof; Lemma 11: the averaging step, the counts of Ψ and the two steps of computation
    C8 (single-wedge pairings give S ⪰ 0 and the radical statement; inertia subtraction for a diagonal metric);
    the reduction of the metric to diagonal form and the rest are proved in the text; Lemma 12: the counts of Ψ
    used with it; the lemma is proved in the text; Lemma 13: the m×4 count (4a − (a+1)) + (3(m − a) − 1) = 3m −
    2; the lemma is proved in the text; Lemma 14: the arithmetic: the two forms of the inequality, its case q =
    1, the m×4 form 2(3m−1)(q−1) ≤ m(m+7) and its equivalence with 6q ≤ m + 13 for m ≥ 5; the inequality itself
    is a written proof; Lemma 15: the key step (the kernel and image cases); the induction is in the text; Lemma
    16: the 2×2 step (a linear space of singular 2×2 matrices has a common kernel or image); the rest is in the
    text; Lemma 17: the three algebraic steps (the rank-one row observation, the evaluation step and the final contradiction),
    with the dimension counts and the common eigenvector of Lemma 18 as hypotheses; Lemma 18: the unperturbed coefficients
    and the induction over the moments; the word analysis of the Neumann expansion enters as a hypothesis; Lemma
    19: every polarization and positivity step (multilinear polarization, B_c P inside its orthogonal, the invariant
    space in dimensions two and three); that negative index at most 3 gives dimension at most 3, and the positivity
    of the quotient in dimension 3 (Witt), are in the text; Lemma 20: the polarization steps, the rank-two case
    and the integer counts; the Schur coefficients (L2) are an exact computation, and the steps quoted from other
    lemmas enter as hypotheses; Lemma 21: the regular tuples for every m (the paper, «What is checked by machine»);
    Theorem 22: pieces: the inertia arithmetic, the values q ≤ 4, the incidence count, the counts of Ψ and the number
    of support triples; the theorem is a written proof; Corollary 2: the arithmetic of the proof; the cited inputs
    (adding one column, the Choi–Lam–Reznick bound, the values for m = 2, 3, 4) enter as hypotheses; Proposition
    23: the trace inequality behind the second-variation step; the dimension count is in the text, and the certificates
    of Appendix B are an exact computation'
