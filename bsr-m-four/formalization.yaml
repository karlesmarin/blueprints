version: v0.4
project:
  name: Every m×4 biquadratic sum of squares is a sum of 3m−1 squares (5 ≤ m ≤ 16)
  description: 'BSR(m,4) ≤ 3m − 1 for 5 ≤ m ≤ 16: every real m×4 biquadratic sum of squares is a sum of at most
    3m − 1 squares of bilinear forms, one below the previous bound 3m; in particular BSR(5,4) ≤ 14, the upper half
    of the conjecture BSR(5,4) = 14 of Qi and Ouyang.'
