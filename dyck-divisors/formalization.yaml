version: v0.4
project:
  name: How Many Dyck Words Do the Divisors of an Integer Make? Exact Counts and Quasipolynomial Growth
  description: The words of Rodríguez Caballero’s language L of semilength k are those of the single finest divisor
    pattern of k, so membership in L is decidable; for the pattern p^a p′^b the number of cells is a classical count
    (two-dimensional threshold functions, Acketa–Žunić and Alekseyev, after an affine rescaling), the number of
    words W(a,b) is eventually a quasipolynomial of degree exactly two in b, and |L_2q| = (9q² − 10q + 13)/4 (odd
    primes q) and |L_3q| = (44q² − 69q + 58 − 3(q/3))/6 (primes q ≥ 5, one lemma computer-assisted).
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
