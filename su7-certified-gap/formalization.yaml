  name: A Certified 2.68 TeV Gap in the Closed-Form Map of the Compactification Scale in SU(7) Grand Gauge-Higgs
    Unification, and the Invariant Its Two Observables Cannot See (Part VIII)
  description: 'In the closed-form map of the SU(7) grand gauge-Higgs model of Komori and Maru, the inverse problem
    is decidable: a target (1/R₅, m_h) gets a bulk content or a named certificate that none exists; on the published
    seed the enumerated image is a finite set of points in clusters, nothing lies in (6.216, 8.897) TeV, and the
    two observables fix four of the five complete invariants on a rung but not the vacuum invariant W.'
