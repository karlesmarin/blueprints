version: v0.4
project:
  name: Quadratic persistence of Segre varieties and a linear gap between biquadratic SOS rank and Zarankiewicz
    bounds
  description: The quadratic persistence of P^{m-1}×P^2 is m and of P^{m-1}×P^3 is ⌈4m/3⌉, with a block bound in
    every width; hence BSR(m,n) − z_2A(m,n) grows linearly for every n ≥ 4, rational forms need exactly three more
    squares, and 8 ≤ BSR(4,3) ≤ 9.
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
