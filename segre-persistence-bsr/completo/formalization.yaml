    of the coefficients c_ij in one group and between two groups. Lower bound, for points in general position: the
    map M ≠ 0 with M a_i ∈ ⟨b_i⟩ (dimension count), M has rank 4, and the pulled-back Plücker form is a nonzero
    symmetric form vanishing on simple tensors with every a_i ⊗ b_i in its radical. Not formalized: the passage
    from radical conditions to the relations c_ij, that general points compute qp (BSSV Lemma 3.3) and the identification
    of these forms with 𝒟; Theorem 3: the mixed component: propagation along the cyclic graph on Z/n kills every
    c_ijh from the vertex equations (mixto); the extraction of the coefficients of t^p over the n-th roots of unity;
    the internal 3 × 3 component. Not formalized: the reduction to blocks and the splitting of ⋀²A*, the factorization
    M^ij = (a_i × a_j) ⊗ v_ij, the derivation of (mixto) from the radical conditions, and the Zariski-open passage
    to rational points; Theorem 6: the uniqueness step: two PSD Gram matrices differing by an element of 𝒟, vanishing
    at points where the radical map is injective, coincide; the Gram matrix of Σ c_j u_j² (c_j > 0, u_j killing
    the points) is PSD, kills the points and has rank e. Uses Mathlib Matrix.PosSemidef.dotProduct_mulVec_zero_iff.
    Not formalized: that 𝒟 is the space of Segre relations and the existence of the points; Question 2: not in the
    note (added 7-nov-2026): above the length-eight form Q of Xu–Cui–Qi, F_t = Q + t(x₂y₁ + x₃y₂ + x₄y₃)² is a sum
    of eight squares for t ≥ 1/2 although its nine-square Gram matrix is extreme of rank nine (the extremality is
    a computation, not formalized)'
