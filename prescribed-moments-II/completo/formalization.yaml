project:
  name: 'Subsets of Fₚ with two prescribed moments, Part II: every exponent — the classification, the Cauchy-Liouville-Mirimanoff
    polynomials that decide the column n=3, and where this moment subset sum stops being PORC'
  description: For every k ≥ 3, the number of n-subsets of Fₚ with Σt = Σt^k = 0 is Artin–Tate exactly for n ∈ {3,4,6}
    when k = 3, n ∈ {3,4} when k = 5, and n = 3 otherwise; the column n = 3 is governed by polynomials Q_k of Cauchy–Liouville–Mirimanoff
    type and is elementary exactly for k ∈ {3,4,5,7}, the k with dim M_{2k}(SL₂(Z)) = 1, and otherwise not PORC.
