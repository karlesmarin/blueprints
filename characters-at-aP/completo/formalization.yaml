  - declaration: RhoLine.thm_crit
    file: ''
    system: Lean 4
    note: 'In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): in type C_m, for the products F_x(X)
      = ∏_{α>0}(1 − X^{(x,α)}), Lean proves that F_ρ divides F_ℓ (dvd_rho_ring over any commutative ring, dvd_rho
      over fields of characteristic zero), so the quotient Q with F_ρ·Q = F_ℓ is a polynomial and no divisibility
      is assumed; and the criterion for Q(ζ) at every q, for the positive pairings of type C_m (thm_crit, thm_crit′),
      with N_q(ρ) ≤ N_q(ℓ) (Nq_rho_le, N_rho_le). Not formalized: the identification χ_λ(g_{p/q}) = ζ^{−(λ,ρ)}Q(ζ)
      from Weyl’s formula (§3; checked exactly on 85 weights, certificate C1); the step from a dominant λ to ℓ =
      λ+ρ (Lean takes ℓ as a list of m integers with positive pairings); and the theorem outside type C_m, where
      it is printed but not formalized.'
