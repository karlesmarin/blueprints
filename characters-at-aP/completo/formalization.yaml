    folded class falls one short (d even) or the occupancies are saturated (d odd) (shape_even, shape_odd).; Theorem
    7.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): on the surviving weights, ζ^{−(λ,ρ)}Q(ζ)
    = (−1)^{E_{p,q}(λ)} Z_q(ℓ)/Z_q(ρ) at ζ = e^{2πip/q} with gcd(p,q) = 1 and dq = 2m+2 (thm_signo, thm_signo′,
    in RhoLineSign and RhoLineDvd); with thm_crit for the vanishing case, the whole statement for Q, sign included.
    Not formalized: the identification of ζ^{−(λ,ρ)}Q(ζ) with χ_λ (Weyl’s formula) and the step from a dominant
    λ to ℓ, as in Theorem 3.1.; Theorem 8.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): at
    k = 2, |Q(ζ)| is the product over the pairings divisible by q of (ℓ,α)/q (thm_val_k2, thm_val_k2_norm; every
    divisible pairing of ρ equals q, rho_div_pairs_eq_q). Not formalized: the regrouping into one factor D_c per
    folded class, which is how the theorem is stated; and, as in Theorem 3.1, the identification with χ_λ and the
    step from λ to ℓ.; Proposition 8.2: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): the version
    with ordered pairs, M_s² = V_s·C_s·D_s with the punctured Vandermonde q^{q−2} and C_s·D_s = q^{q−2}·D, which
    the note identifies with M_s² = M_0². Not formalized: the step from the unordered product M_s = A_sB_sD_s to
    that expression.; Theorem 8.3: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): at the powers
    of a_P (dq = 2m + 2), |Q(ζ)| = ∏_{q∣(ℓ,α)}(ℓ,α) / ∏_{q∣(ρ,α)}(ρ,α) for any ℓ with positive pairings and N_q(ℓ)
    = N_q(ρ) (thm_valgen; thm_valgen′ with F_ρ·Q = F_ℓ now proved). Not formalized: the identification with χ_λ
    and the step from λ to ℓ, as in Theorem 3.1.; Lemma 8.4: In the paper (Formalization, Lean 4 + Mathlib, commit
    6283de8): with ζ primitive, dq = 2m+2 and equal counts, the non-vanishing factors of ℓ and of ρ have equal modulus,
    without any divisibility of the products (lem_unit, through the residue lemma ResidueCapacity.prop_res_cap).
    Not formalized: the step from a dominant λ to ℓ = λ+ρ (ℓ is a list of m integers with positive pairings).; Proposition
    9.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): the residue identities: the identity in
    the form 2ℛ_x + 2m = P_x² + P_x(X²) over a finite abelian group (eq_res), and ℛ_x = ℛ_ρ under the capacities
    over ZMod q (prop_res_cap).; Theorem 10.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): both
    parities: the factorisation of Z_q(ℓ)/Z_q(ρ) into κ·|D_0|·|D_{q/2}|·∏_c|D_c|, with κ = 1 when d is odd or the
    free place lies in the class 0 and κ = 2 otherwise (dims_odd, dims_odd_occ, dims_even_occ; GL on the non-fixed
    classes, Sp on the class 0, SO on the class q/2); the occupancies of the folded classes are derived from N_q(ℓ)
    = N_q(ρ) (occ_odd, occ_even). Not formalized: the partitions ν^{(c)} and the oriented rows enter as data with
    their defining equations (that ν^{(c)} is a partition is not proved), for lists ℓ of length m (the step from
    a dominant λ to ℓ is not stated).; Corollary 12.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8):
    the two congruences on the counts (G2Counts: N_q against r_q at q = 3 and q = 2). The link to the vanishing
    of the character is the criterion of Theorem 3.1; the signed value of G_2 in the box after the corollary is
    not formalized.; Observation 13.1: In the paper (Formalization, Lean 4 + Mathlib, commit 6283de8): the arithmetic
    statement over any crystallographic root pairing with a base (PHeight): the coroot coefficients in the dual
    base, ht_P(α) = ((α,α)/2)·ht(α^∨) = (ρ,α), and the three clauses, under the stated hypothesis on the two root
    lengths ((α,α)/2 ∈ {1, r}) and a ρ with ⟨ρ, α_i^∨⟩ = 1.'
