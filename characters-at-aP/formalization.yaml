  - declaration: RhoLine.thm_crit
    file: ''
    system: Lean 4
    note: 'added to the Lean repository after publication (08-nov-2026): Theorem 3.1 from the product (2): if F_ρ·Q
      = F_ℓ, then Q(ζ) ≠ 0 at a primitive q-th root iff N_q(ℓ) = N_q(ρ), and N_q(ρ) ≤ N_q(ℓ); eval_quot gives the
      exact value when the counts agree. Not formalized: that ζ^{−(λ,ρ)}Q(ζ) is the character (formula (2), Weyl),
      certified exactly in certificar_exacto.py (C1); and that F_ρ divides F_ℓ, taken as hypothesis.; added to the
      Lean repository after publication (09-nov-2026): The product (2) is a polynomial: F_ρ divides F_ℓ for every
      ℓ of length m with positive pairings (ρ minimizes N_d for every d), so Theorems 3.1, 7.1 and 8.3 hold in Lean
      without the quotient hypothesis. Only the identification of ζ^{−(λ,ρ)}Q(ζ) with the character (formula (2),
      Weyl) is outside Lean.'
