version: v0.4
project:
  name: Integer character values on the ρ-line of Sp(2m)
  description: On the ρ-line of Sp(2m) exactly four families of denominators make every character an integer; a
    character vanishes exactly when λ+ρ lies on more root walls modulo q than ρ; and at every power of Kostant’s
    element a_P its value is an explicit signed ratio of root products, whose modulus is 1 or 2 times a product
    of dimensions of GL, Sp and SO representations.
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
  license: Apache-2.0 (formalizations repository)
  blueprint: https://karlesmarin.github.io/blueprints/characters-at-aP/
