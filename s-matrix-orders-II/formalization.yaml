version: v0.4
project:
  name: The order generated by a column of the SU(n)ₖ S-matrix is locally a numerical semigroup ring (Part II)
  description: For the orders generated by the columns of the SU(n)ₖ S-matrix at prime height, the small defects
    are classified by vanishing power sums, the proportion of columns with defect ≥ 2 is 2/p − 1/p² and the mean
    defect 1 + 2/p + 3/p² up to explicit errors, and Gauss’s half-systems give an infinite family of non-Gorenstein
    orders with value semigroup ⟨3,5,7⟩; the discriminant splitting that links this to the gluing term is measured,
    not proved.
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
