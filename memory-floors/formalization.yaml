version: v0.4
project:
  name: 'Exact limits on writing a superconducting quantum memory: when can pulse shaping beat the resonant swap?'
  description: 'For the exchange of one excitation between a lossy superconducting qubit and a memory mode with
    bounded coupling, relaxation at unequal rates and Markovian dephasing: no pulse transfers more population than
    the resonant swap, at a fixed duration none beats the resonant pulse followed by a wait in the less lossy element,
    and the write infidelity has an exact lower bound that the resonant pulse misses by less than 1.5e-6 for a recent
    phonon-memory processor.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
  license: Apache-2.0 (formalizations repository)
  blueprint: .
