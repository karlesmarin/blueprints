version: v0.4
project:
  name: 'The Clock That Never Ticks: a machine-checked path from the dilogarithm to quantum speed limits in Lean
    4'
  description: 'A sorry-free Lean 4 development of the real dilogarithm (reflection, Landen, duplication, the golden-ratio
    values without the five-term relation), the Clausen function and Catalan’s constant, the Fejér–Jackson inequality,
    the Margolus–Levitin and an L¹ Mandelstam–Tamm speed limit, assembled into: the weight-2 zeta state never reaches
    an orthogonal state. Version 2 says why in one line (a dominant lowest level), places the Zieliński–Zych limits,
    and proves the exact floor 1 − 2^(1−s) of every zeta state, in Lean and in Isabelle. Classical mathematics;
    the contribution is the formalization and its assembly.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
  license: Apache-2.0 (formalizations repository)
  blueprint: https://karlesmarin.github.io/blueprints/dilogarithm-clock/
