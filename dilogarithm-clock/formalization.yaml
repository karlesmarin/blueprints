      on the unit circle (so every zeta state p_n ∝ n^(−s) has |S| ≥ 1 − 2^(1−s)); classical (Fejér 1937; Boyer–Parry
      2021, Lemma 8 for s = 2); added to the Lean repository after publication (27-oct-2026): version 2 of the paper:
      the one-line reason the weight-2 zeta state never becomes orthogonal, p₁ = 6/π² > 1/2 (Uffink’s cut-off inequality,
      after Andrews 2007); added to the Lean repository after publication (27-oct-2026): version 2 of the paper:
      the Zieliński–Zych bound τ ≥ π/(2M_α)^{1/α} with its inequality, proved for 0 < α ≤ 1, and the limit α → 0,
