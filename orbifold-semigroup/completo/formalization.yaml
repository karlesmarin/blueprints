version: v0.4
project:
  name: 'An Affine Semigroup from Orbifold Boundary Conditions: cut, phylogenetic and hierarchical models in the
    unit-weight sector, and weighted configurations beyond them (Part IX-B)'
  description: The equivalence classes of orbifold boundary conditions form an affine semigroup, identified in the
    unit-weight sector with cut, group-based and binary hierarchical configurations; thirteen of the cases are complete
    intersections with explicit gluing trees, the group-based tripod is one exactly when |G| ≤ 3, (S¹/Z₂)ᵏ is none
    for k ≥ 3, and the exceptional product case has a unique minimal Markov basis of 8 + 8 indispensable binomials
    and Cohen–Macaulay type 9.
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
  license: Apache-2.0 (formalizations repository)
