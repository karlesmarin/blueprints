project:
  name: 'Quantum state transfer through a lossy bus: fundamental error limits for every control pulse, with application
    to IBM''s meter-scale interconnects'
  description: 'Error floors for quantum state transfer through a lossy bus that hold for every control pulse, every
    duration and any number of bus modes: P(T) ≤ e^{−γT}/[1 + (κ−γ)/(G²T)] (Isabelle), the end qubits must be occupied
    (Isabelle), the perturbative constant 2√(2γ(κ−γ))/G becomes a bound over all controls and is attained by an
    explicit pulse; with a rate per element and reciprocity, the floors of IBM’s meter-scale links are 6.03–10.05
    × 10⁻⁴ on 1 − F_B (certified with ball arithmetic), 11–16 times below the measured errors. With the lab Check
    your link.'
