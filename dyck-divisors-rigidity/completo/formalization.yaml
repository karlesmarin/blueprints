version: v0.4
project:
  name: How Many Dyck Words Do the Divisors of an Integer Make? II. Generic Rigidity and Persistent Ambiguity
  description: 'For the words of Rodríguez Caballero of the integers 2^(e−1) r^a s^b, the excess E(a,b) = R(a,b)
    − W(a,b) of cells over words: crossing a wall raises the sum of the word multiset by (a+1−|h|)(b+1−|ρ|), so
    fibres are antichains of at most 4ab+1 cells; R(a,b) = C_a b(b+1) + (a+1)b + π_a(b); E(a,b) = Θ(b) and W(a,b)
    = C_a b² + O(b) for a = 2, …, 5 by a computer-assisted affine certificate; the all-positive chamber has no two-parameter
    family for any a ≥ 2 (written proof; non-integrality in Isabelle/HOL); Lemma D for a = 3 (computer-assisted);
    a conjectural classification for a = 3 checked against exact enumeration.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
