fidelity:
  divergences: 'Proposition 3.1: (a), (c) and the weight ω ≥ 1 of (b); the geometric part of (b), that crossing
    a wall at a point on no other line changes only c_h, is not formalized; Corollary 3.2: (ii) and (iii); (i) rests
    on the geometric part of Proposition 3.1(b) and is not formalized; Lemma 3.6: the counting argument, for any
    finite set with a word map; that the set is the set of cells is the paper’s setting; Proposition 3.9: the counting
    part: 2W ≤ R + f for an involution that preserves words and has f fixed cells; that σ permutes the cells and
    fixes exactly 2a+1 of them is the geometric part, taken as a hypothesis; Proposition 6.3: (i) for a ≥ 2, and
    (ii) as a line of the arrangement that separates the two points (an integer ρ ∈ [−b, b], so the coordinates
    c_{−a} differ); (iii) and (iv) (segments, lengths and the bounds on each side) and the identification of a cell
    with a connected region are not formalized; Proposition 9.1: all but the last sentence (for s = 0 both vectors
    lie in the fibre of O(0)); Theorem 9.2: the five families for every b, i and ε in the stated ranges (affine
    witnesses, distinct vectors, Z(P) = Z(Q) through an involution of the grid); the numbers of pairs are not formalized;
    Theorem 9.4: only the paragraph on witnesses: for m ∈ {2, 3}, ρ ∈ {0, 1} and n ≥ 1, c and G are realisable and
    differ in c_{−1}; the words Z(c), Z(G), their equality and the count of pairs are not formalized; Corollary
    9.5: the first sentence: the four vectors have the same multiset Z(c) (the equivalence of Z(c) with the word
    is taken from [I]); the second sentence is not formalized; Theorem 9.7: the counting part: E ≥ |𝒰| − |π₀(𝒢_b)|
    once each listed set has one word; that they do is Proposition 9.1, Theorems 9.2 and 9.4 and Corollary 9.5'
