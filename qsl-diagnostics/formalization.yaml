version: v0.4
project:
  name: Certified Speed-Limit Diagnostics for Deployed Superconducting Quantum Processors
  description: 'Quantum-speed-limit inequalities proved in Lean 4 and what they say about the calibrated gates of
    pre-Heron IBM processors: single-qubit X gates last a median 11.3 times the two-level limit at full drive amplitude,
    about 2 times the square-pulse limit at the drive IBM uses, and about 10 times the model minimum within the
    full amplitude; two-qubit gates 4.22 times the qubit-subspace CNOT-class bound. With a second transmon level
    the CZ time lies between 0.295 and 0.331 of the qubit-only exchange time (version 3), and the entangling-time
    bound becomes tight as the local dimension grows (certified). Version 2: IBM’s chip-to-chip state transfer runs
    at 5.8–7.9 times the single-mode minimal time, whose lower bound is machine-checked in Isabelle. With the scripts,
    data and optimized pulses.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
