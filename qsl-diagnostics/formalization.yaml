fidelity:
  divergences: 'b:table: the statements of Table I (twenty Lean names), each checked by the Lean kernel in the public
    repository (commit 42f307b); the «status» column is the paper’s reading of the literature, not a Lean statement;
    b:twolevel: constant Rabi frequency: Margolus–Levitin. Time-dependent drive: (i) piecewise-constant evolutions
    with spectral width at most Ω_max move any state by a Fubini–Study angle at most (Ω_max/2)T; (ii) fixed-axis
    drive: equality case of the generalized Mandelstam–Tamm bound; (iii) transfer to fidelity 1−ε: Ω_max T ≥ 2 arccos
    √ε. Continuous pulses are covered only as limits of piecewise-constant ones (not formalized).; b:cnot: the Bell-vector
    bound and its extension to (P⊗Q)·Bell, which covers every gate only locally equivalent to CNOT (ECR); the CNOT
    consequence itself is the Bell bound applied to |+⟩|0⟩; t:certified: the two bounds; the ratios (8.7 chord,
    8.4 sharp, and ≈ 16.9 with the second level) are computations on vendor data, not Lean statements; r:cz: the
    entangling-time bound (J = ‖H_c‖ = 2J for d = 3, giving π/(8J)), its robust form with tolerance ε and the 97/32
    lemma of the refined bound (QSL.Exchange.refined_cz_lemma; see r:czrefined); the CZ solutions themselves are
    numerical witnesses, not Lean statements; r:czconstr: only the lower bound π/(8J) (entangling-time theorem with
    ‖H_c‖ = 2J, d = 3); the upper bound, the explicit construction, is not formalized; r:choi: the tolerance theorem
    (ε the infidelity of one output state); its instantiation with two-level references on each transmon, which
    turns it into a bound on the gate in the trace metric, is ours and not formalized; r:czrefined: the lemma (1/4)·Tr[(P_A⊗P_B)H_c²]
    ≤ (97/32)J² for rank-2 projectors on d = 3, and its equality case at P = 1 − |v⟩⟨v|, |v⟩ = √(7/8)|0⟩ + √(1/8)|2⟩;
    the time argument built on it (the comparator trajectory L(t), the Fubini–Study speed, the distance π/4 from
    the product states) is not formalized; r:asymptotic: λ_d²/2 ≤ κ_d ≤ 2(d−1) (exchange_norm_ge, exchange_norm_le),
    λ_d ≥ 2(1 − 1/m)√(d − m) for the largest eigenvalue (lamMax_ge) and 2κ_d/λ_d² → 1 (ratio_tendsto_one), in Formalizations/Physics/QuantumMechanics/SpeedLimit/ExchangeQuadrature.lean;
    the rate O(d^(−2/3)) (asymptotics of the largest Hermite zero, DLMF 18.16.17), the d-level CZ construction itself
    and the table of ratios are not formalized; r:heis: the lower bound: arccos λ ≤ T‖H − c1‖ for every real c,
    and the Heisenberg Bell time T ≥ π/8; the explicit trajectory e^{−iHT}|01⟩ is an analytic computation in the
    paper, not a Lean statement; v:floor: the angle bound fsAngle ≤ (Ω/2)·T for piecewise-constant Hamiltonians
    in any dimension, applied with shift c = 0 and Ω/2 = √2 g; the norm ‖H‖ = (|g₁|² + |g₂|²)^{1/2} and the angle
    π/2 of the transfer are the paper’s one-line application'
