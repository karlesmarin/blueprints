<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="width=device-width" name="viewport"/>
<title>PDF: The Pentagon, Machine-Checked: Abel's five-term relation for the dilogarithm in Lean 4</title><style>
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font-family:serif}
#vistas{position:sticky;top:0;z-index:50;background:#e3edf7;border-bottom:1px solid #b9cde2;padding:.6em 16px;
        font-size:.9em;display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
#vistas a{font:13.333px Arial,sans-serif;border:1px solid #9fb7cf;background:#fff;border-radius:4px;padding:.2em .8em;
          color:#222;text-decoration:none}
#vistas a.on{background:#8e24aa;color:#fff;border-color:#8e24aa;font-weight:600}
#vistas .nota{color:#555;font:12px Arial,sans-serif}
iframe{flex:1;border:0;width:100%}
</style></head><body>
<div id="vistas"><span>View:</span>
<a href="index.html" onclick="try{localStorage.setItem('vista','paper')}catch(e){}">📄 Paper</a>
<a href="index.html" onclick="try{localStorage.setItem('vista','explore')}catch(e){}">🔍 Explore</a>
<a href="mapa.html">🗺️ Map of the paper</a>
<a class="on" href="pdf.html">📕 PDF</a>
<a download="" href="paper.pdf" id="pdfdl">⬇ download</a>
<span class="nota">The paper as LaTeX typesets it; links on the site open it at the right page.</span></div>
<iframe id="pdf" src="paper.pdf" title="The paper (PDF)"></iframe>
<script>
// the PDFs of the paper (the original and its translations) and, for each, the page of every statement: a link
// #page=N&n=<label> opens the statement at its own page in the language the reader chose (remembered)
var LM_PDF = {"en": {"file": "paper.pdf", "pages": {"thm:five": 3}}, "es": {"file": "paper_es.pdf", "pages": {"thm:five": 3}}};
(function(){
  function lang(){
    var l = null;
    try { l = localStorage.getItem('lm-pdf-lang'); } catch (e) {}
    return LM_PDF[l] ? l : 'en';
  }
  function open(){
    var L = lang(), d = LM_PDF[L];
    var n = /[#&]n=([^&]+)/.exec(location.hash), p = /page=(\d+)/.exec(location.hash);
    var page = n && d.pages[decodeURIComponent(n[1])] ? d.pages[decodeURIComponent(n[1])] : (p ? p[1] : null);
    document.getElementById('pdf').src = d.file + (page ? '#page=' + page : '');
    var dl = document.getElementById('pdfdl') || document.querySelector('a[download]');
    if (dl) dl.setAttribute('href', d.file);
    document.querySelectorAll('a[data-lang]').forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('data-lang') === L);
    });
  }
  // the language switch is drawn here, in whatever bar the layout gave the page (the classic layout rebuilds it)
  var langs = Object.keys(LM_PDF);
  if (langs.length > 1) {
    var bar = document.querySelector('header.pc-head nav, nav.pc-opts, #vistas');
    if (bar && !bar.querySelector('a[data-lang]')) {
      var NAMES = {"en": "English", "es": "Español", "fr": "Français", "de": "Deutsch", "it": "Italiano", "ca": "Català"};
      langs.forEach(function (l) {
        var a = document.createElement('a'); a.href = '#'; a.setAttribute('data-lang', l);
        a.textContent = NAMES[l] || l; a.title = 'The paper in ' + (NAMES[l] || l);
        bar.appendChild(a);
      });
    }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-lang]');
    if (!a) return;
    e.preventDefault();
    try { localStorage.setItem('lm-pdf-lang', a.getAttribute('data-lang')); } catch (x) {}
    open();
  });
  window.addEventListener('hashchange', open); open();
})();
</script>
</body></html>
