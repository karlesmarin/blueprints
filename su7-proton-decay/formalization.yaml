  name: 'Proton Decay in SU(7) Grand Gauge-Higgs Unification: An Obstruction, Its Minimal Escapes, and the One Row
    of Their Table 1 That Can Pay for Them (Part VI)'
  description: In the one-generation SU(7) grand gauge-Higgs model of Komori and Maru, anomaly cancellation forces
    the leftover U(1)′ to be T₃L + Y − (B − L), blind to every dimension-6 proton operator; the family-dependent
    escapes are classified inside their group, and at one-loop curvature only case (2) of their Table 1 can pay
    for them — a benchmark selected, not a model delivered.
