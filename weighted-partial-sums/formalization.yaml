version: v0.4
project:
  name: 'Zeros of weighted partial sums of completely multiplicative functions: Dirichlet characters, the Euler
    factor at 2 and Conrey''s sine series'
  description: Every length m ≡ 0, 3 (mod 4) is a zero of the weighted sum Σ n ε(n) for some completely multiplicative
    ε = ±1; the ε with infinitely many zeros form a dense G_δ of probability zero; quadratic characters give explicit
    ones through a digit recursion in base q, governed by the Euler factor at 2.
