<svg xmlns="http://www.w3.org/2000/svg" width="640" height="188" viewBox="0 0 640 188"
     role="img" aria-labelledby="title description">
  <title id="title">De la ficha a la prueba en Lean</title>
  <desc id="description">1. Encuentra el teorema. Busca triangle · R0002. 2. Lee la firma e importa. Firma · Módulo Geometry. 3. Aplica la identidad. x = y = z = 1 y A + B + C = π. 4. Comprueba en Lean. lake lean Example.lean. cos A + cos B + cos C ≤ 3/2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#617c93" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="186" rx="18" fill="#f1f7fa" stroke="#ccdde7"/>
  <g fill="none" stroke="#617c93" stroke-width="2.4" marker-end="url(#arrow)">
    <path d="M 300 42 H 337"/>
    <path d="M 480 72 V 86"/>
    <path d="M 340 119 H 303"/>
    <path d="M 160 149 V 158"/>
  </g>
  <g fill="#fff" stroke="#c6dce8" stroke-width="1.25">
    <rect x="21" y="12" width="278" height="58" rx="12"/>
    <rect x="341" y="12" width="278" height="58" rx="12"/>
    <rect x="341" y="89" width="278" height="58" rx="12"/>
    <rect x="21" y="89" width="278" height="58" rx="12"/>
  </g>
  <g>
    <circle cx="51" cy="33" r="14" fill="#0f6e8c"/>
    <circle cx="371" cy="33" r="14" fill="#0f6e8c"/>
    <circle cx="371" cy="110" r="14" fill="#6b4c9a"/>
    <circle cx="51" cy="110" r="14" fill="#2a7351"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif">
    <g fill="#fff" text-anchor="middle" font-size="15" font-weight="700">
      <text x="51" y="38">1</text>
      <text x="371" y="38">2</text>
      <text x="371" y="115">3</text>
      <text x="51" y="115">4</text>
    </g>
    <g fill="#1d2530" font-size="19" font-weight="700">
      <text x="75" y="40">Encuentra el teorema</text>
      <text x="395" y="40">Lee la firma e importa</text>
      <text x="395" y="117">Aplica la identidad</text>
      <text x="75" y="117">Comprueba en Lean</text>
    </g>
    <g fill="#405366" font-size="16">
      <text x="37" y="61">Busca triangle · R0002</text>
      <text x="357" y="61">Firma · Módulo Geometry</text>
      <text x="357" y="138">x = y = z = 1 y A + B + C = π</text>
      <text x="37" y="138" font-family="Consolas, monospace">lake lean Example.lean</text>
    </g>
    <rect x="21" y="161" width="598" height="20" rx="9" fill="#d9eee3"/>
    <text x="320" y="177" text-anchor="middle" fill="#215b40" font-size="17" font-weight="700">cos A + cos B + cos C ≤ 3/2</text>
  </g>
</svg>
