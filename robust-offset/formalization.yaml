version: v0.4
project:
  name: 'Robust qubit–memory transfer against quasi-static frequency noise costs time and exposure: exact bounds
    from Dubins curves'
  description: 'For the lossless exchange of one excitation with coupling |g| ≤ G and any detuning, cancelling a
    static frequency offset to first order costs time and exposure: an exact disk inequality between the exposures
    of qubit and memory, the minimal time for every residual offset, the exact exposure cost for pulses of fixed
    phase from Dubins curves, and the second-order error under quasi-static noise, with and without memory loss.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
