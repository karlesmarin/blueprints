version: v0.4
project:
  name: The order generated by a column of the SU(n)ₖ S-matrix is locally a numerical semigroup ring (Part I)
  description: At prime height p = n+k, the ring generated by one column of the SU(n)_k S-matrix is the integers
    of a cyclotomic field tensored with an order that is, locally at p, a monomial ring with value semigroup S_T;
    the index, the Gorenstein property and the exponent are read off S_T, and S_T off the nonzero power sums of
    the spectrum when p > (n−1)(n−2) or n ≤ 12.
