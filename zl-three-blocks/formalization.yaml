version: v0.4
project:
  name: Why three blocks? The limited augmented Zarankiewicz number in fixed width
  description: 'The limited augmented Zarankiewicz number in fixed width: z_L(m,3) = ⌊3m/2⌋ + 2 for every m ≥ 3
    (Lean); for every n, F_n(m) = ρ_n m + O(1) with ρ_n rational from finitely many linear programs, the error eventually
    periodic; three-block modules give ρ_n ≥ λ_n = n/3 − 1/2 + O(1/n), optimal in their family, with equality for
    n ≤ 6 by certified rational duals; the canonical base has slope ⌊(n−1)²/4⌋/(n−1) for every n; z_L(m,4) for every
    m ≥ 6 (certified); admissibility lemmas in Isabelle/HOL.'
  authors:
