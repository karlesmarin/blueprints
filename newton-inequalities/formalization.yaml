project:
  name: 'The Inward Bow of a Real-Rooted Polynomial: Newton''s Inequalities, Machine-Checked in Lean 4'
  description: 'If a real polynomial of degree n has only real roots, its elementary symmetric functions satisfy
    Newton''s inequalities e_k² C(n,k−1) C(n,k+1) ≥ e_{k−1} e_{k+1} C(n,k)² (equivalently, the normalized means
    are log-concave). Classical mathematics, formalized in Lean 4: the symmetric-function form for monic p, the
    coefficient form with no normalization.'
