project:
  name: Rational sums-of-squares lengths of biquadratic forms and orthogonal dilations
  description: 'Rational sums-of-squares lengths of the biquadratic forms of symmetric contractions: real length
    n or n + 1, a global criterion over Q(t), and for one interior eigenvalue an exact local procedure, an excess
    of at most 7, attained first in order 6, and a closed formula for scalar dilations; for odd n the complete graph
    has rational length n exactly when n or n − 2 is a square.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
