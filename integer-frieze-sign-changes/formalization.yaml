version: v0.4
project:
  name: Integer frieze patterns and Tabachnikov's four sign changes
  description: 'For every n ≥ 14, two integer (Conway–Coxeter) frieze patterns of width n − 3 with fewer than four
    sign changes in a row: strictly ordered middle rows for even n, exactly two sign changes in row ⌊w/2⌋ for odd
    n (inside the range of Tabachnikov’s Problem 1); 14 and 15 are the smallest n, by exhaustive search. Both families
    checked in Isabelle/HOL for every n.'
  authors:
  - Carles Marín Muñoz
  responsible_maintainers:
  - Carles Marín Muñoz
  license: Apache-2.0 (formalizations repository)
