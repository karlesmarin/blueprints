project:
  name: For m ≥ 2, every m×3 biquadratic sum of squares is a sum of 2m squares
  description: 'BSR(m,3) = 2m for every m ≥ 2: every m×3 biquadratic sum of squares is a sum of 2m squares of bilinear
    forms (new for m ≥ 4; in particular BSR(4,3) = 8), answering Qi, Löfberg and Chen. As a consequence BSR(m,4)
    ≤ 3m, so 11 ≤ BSR(4,4) ≤ 12.'
